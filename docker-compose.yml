services:
  claim-detector:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CLAIM_USE_ONNX=false
      - CLAIM_ACTIVE_MODEL=distilbert-base-uncased
      - CLAIM_RATE_LIMIT=120/minute
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
