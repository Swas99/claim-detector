<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Detector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container { max-width: 720px; width: 100%; }
        h1 { font-size: 28px; font-weight: 600; margin-bottom: 6px; color: #fff; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
        textarea {
            width: 100%;
            min-height: 90px;
            padding: 16px;
            background: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 14px;
        }
        textarea:focus { border-color: #4f8ff7; }
        textarea::placeholder { color: #555; }
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        button {
            padding: 10px 24px;
            background: #4f8ff7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #3a7ae0; }
        button:disabled { background: #333; cursor: not-allowed; }
        .btn-secondary { background: #2a2d3a; }
        .btn-secondary:hover { background: #3a3d4a; }
        select {
            padding: 10px 14px;
            background: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .example-chip {
            padding: 5px 12px;
            background: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 16px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .example-chip:hover { border-color: #4f8ff7; color: #bbb; }

        /* Single result */
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #1a1d27;
            border-radius: 10px;
            border: 1px solid #2a2d3a;
            display: none;
        }
        .result.visible { display: block; }
        .result-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .badge {
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge.claim { background: #1a3a2a; color: #4ade80; border: 1px solid #2d5a3d; }
        .badge.not-claim { background: #3a1a1a; color: #f87171; border: 1px solid #5a2d2d; }
        .confidence-text { font-size: 14px; color: #888; }
        .confidence-text span { color: #fff; font-weight: 600; }
        .conf-bar-bg { height: 5px; background: #2a2d3a; border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
        .conf-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .conf-bar-fill.claim { background: #4ade80; }
        .conf-bar-fill.not-claim { background: #f87171; }
        .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 8px; }
        .attribution { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .token-chip {
            padding: 5px 10px;
            background: #232636;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .token-chip .token { color: #e0e0e0; }
        .token-chip .weight { color: #4f8ff7; font-size: 11px; font-weight: 600; }
        .meta { font-size: 12px; color: #555; }
        .meta span { color: #888; }

        /* Comparison view */
        .compare-grid {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            display: none;
        }
        .compare-grid.visible { display: grid; }
        .compare-card {
            padding: 16px;
            background: #1a1d27;
            border-radius: 8px;
            border: 1px solid #2a2d3a;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .compare-card.ensemble { border-color: #4f8ff7; background: #161a2a; }
        .compare-model { font-size: 13px; color: #aaa; min-width: 100px; font-weight: 500; }
        .compare-badge {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .compare-badge.claim { background: #1a3a2a; color: #4ade80; }
        .compare-badge.not-claim { background: #3a1a1a; color: #f87171; }
        .compare-conf { color: #888; font-size: 13px; flex: 1; text-align: right; }
        .compare-bar { flex: 2; }
        .compare-bar-bg { height: 4px; background: #2a2d3a; border-radius: 2px; overflow: hidden; }
        .compare-bar-fill { height: 100%; border-radius: 2px; }

        .spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid #333; border-top-color: #4f8ff7;
            border-radius: 50%; animation: spin 0.6s linear infinite; margin-left: 8px;
        }
        .spinner.active { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer { margin-top: 48px; font-size: 12px; color: #444; text-align: center; }
        footer a { color: #4f8ff7; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Claim Detector</h1>
        <p class="subtitle">Identifies whether a sentence contains a verifiable factual claim</p>

        <textarea id="input" placeholder="Enter a sentence to analyze..."></textarea>

        <div class="controls">
            <select id="model-select">
                <option value="distilbert-base-uncased">DistilBERT</option>
                <option value="bert-base-uncased">BERT</option>
                <option value="ModernBERT-base">ModernBERT</option>
                <option value="ensemble">Ensemble (all models)</option>
            </select>
            <button id="analyze-btn" onclick="analyze()">
                Analyze <div class="spinner" id="spinner"></div>
            </button>
            <button class="btn-secondary" onclick="compareAll()">
                Compare All <div class="spinner" id="spinner2"></div>
            </button>
        </div>

        <div class="examples">
            <div class="example-chip" onclick="setExample(this)">GDP grew 2.1% last quarter.</div>
            <div class="example-chip" onclick="setExample(this)">I think pizza is great.</div>
            <div class="example-chip" onclick="setExample(this)">What time is it?</div>
            <div class="example-chip" onclick="setExample(this)">The earth orbits the sun.</div>
            <div class="example-chip" onclick="setExample(this)">I wonder if that's true.</div>
        </div>

        <!-- Single model result -->
        <div class="result" id="result">
            <div class="result-header">
                <div class="badge" id="badge"></div>
                <div class="confidence-text">Confidence: <span id="conf-value"></span></div>
            </div>
            <div class="conf-bar-bg">
                <div class="conf-bar-fill" id="conf-bar"></div>
            </div>
            <div id="attr-section">
                <div class="section-label">Key tokens</div>
                <div class="attribution" id="attribution"></div>
            </div>
            <div class="meta">Model: <span id="meta-model"></span></div>
        </div>

        <!-- Comparison view -->
        <div class="compare-grid" id="compare-grid"></div>
    </div>

    <footer>
        Powered by fine-tuned transformers &middot; <a href="/docs">API Docs</a> &middot; <a href="/model/info">Model Info</a>
    </footer>

    <script>
        const input = document.getElementById('input');

        function setExample(el) {
            input.value = el.textContent;
            analyze();
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); analyze(); }
        });

        async function analyze() {
            const text = input.value.trim();
            if (!text) return;
            const model = document.getElementById('model-select').value;

            document.getElementById('analyze-btn').disabled = true;
            document.getElementById('spinner').classList.add('active');
            document.getElementById('result').classList.remove('visible');
            document.getElementById('compare-grid').classList.remove('visible');

            try {
                const resp = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, model }),
                });
                const data = await resp.json();
                if (!resp.ok) { alert(data.detail || 'Error'); return; }
                showResult(data);
            } catch (e) {
                alert('Failed to connect: ' + e.message);
            } finally {
                document.getElementById('analyze-btn').disabled = false;
                document.getElementById('spinner').classList.remove('active');
            }
        }

        function showResult(data) {
            const badge = document.getElementById('badge');
            badge.textContent = data.is_claim ? 'Claim' : 'Not a Claim';
            badge.className = 'badge ' + (data.is_claim ? 'claim' : 'not-claim');

            const pct = (data.confidence * 100).toFixed(1);
            document.getElementById('conf-value').textContent = pct + '%';
            const bar = document.getElementById('conf-bar');
            bar.style.width = pct + '%';
            bar.className = 'conf-bar-fill ' + (data.is_claim ? 'claim' : 'not-claim');

            const attrDiv = document.getElementById('attribution');
            const attrSection = document.getElementById('attr-section');
            attrDiv.innerHTML = '';
            if (data.attribution && data.attribution.length > 0) {
                attrSection.style.display = 'block';
                data.attribution.forEach(a => {
                    const chip = document.createElement('div');
                    chip.className = 'token-chip';
                    chip.innerHTML = `<span class="token">${esc(a.token)}</span><span class="weight">${(a.weight * 100).toFixed(1)}%</span>`;
                    attrDiv.appendChild(chip);
                });
            } else {
                attrSection.style.display = 'none';
            }

            document.getElementById('meta-model').textContent = data.model;
            document.getElementById('result').classList.add('visible');
        }

        async function compareAll() {
            const text = input.value.trim();
            if (!text) return;

            document.getElementById('spinner2').classList.add('active');
            document.getElementById('result').classList.remove('visible');
            document.getElementById('compare-grid').classList.remove('visible');

            try {
                const resp = await fetch('/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text }),
                });
                const data = await resp.json();
                if (!resp.ok) { alert(data.detail || 'Error'); return; }
                showComparison(data);
            } catch (e) {
                alert('Failed to connect: ' + e.message);
            } finally {
                document.getElementById('spinner2').classList.remove('active');
            }
        }

        function showComparison(data) {
            const grid = document.getElementById('compare-grid');
            grid.innerHTML = '';

            const allPreds = [...data.predictions, data.ensemble];
            allPreds.forEach(p => {
                const pct = (p.confidence * 100).toFixed(1);
                const isClaim = p.is_claim;
                const cls = isClaim ? 'claim' : 'not-claim';
                const isEnsemble = p.model === 'ensemble';

                const card = document.createElement('div');
                card.className = 'compare-card' + (isEnsemble ? ' ensemble' : '');
                card.innerHTML = `
                    <div class="compare-model">${esc(p.model)}</div>
                    <div class="compare-badge ${cls}">${isClaim ? 'CLAIM' : 'NOT CLAIM'}</div>
                    <div class="compare-bar">
                        <div class="compare-bar-bg">
                            <div class="compare-bar-fill ${cls}" style="width:${pct}%"></div>
                        </div>
                    </div>
                    <div class="compare-conf">${pct}%</div>
                `;
                grid.appendChild(card);
            });

            grid.classList.add('visible');
        }

        function esc(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
