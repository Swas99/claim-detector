[project]
name = "claim-detector"
version = "0.1.0"
description = "Sentence-level claim detection API with fine-tuned transformer models"
requires-python = ">=3.11"
dependencies = [
    # ML / Training
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "onnxruntime>=1.17.0",
    "onnx>=1.16.0",
    "optimum[onnxruntime]>=1.19.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
    "accelerate>=0.30.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "slowapi>=0.1.9",
    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "cachetools>=5.3.0",
    "structlog>=24.1.0",
    "numpy>=1.26.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "locust>=2.24.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "nbformat>=5.10.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
